version: '3.8'

services:
  db:
    image: postgres:17-alpine
    container_name: fundsroom-db
    environment:
      POSTGRES_DB: fundsroom_erp
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    restart: always

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fundsroom-backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/fundsroom_erp
      - JWT_SECRET=super_secret_for_fundsroom_erp_123
    depends_on:
      - db
    restart: always
    # Automatically run migrations on start
    command: sh -c "npx prisma db push && npm start"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=http://localhost:5000/api
    container_name: fundsroom-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: always

volumes:
  pg_data:
